# ============================================
# ResQNet Backend Configuration
# ============================================

# Server
server.port=8081

# ============================================
# Database Configuration
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/resqnet_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# JWT Configuration
# ============================================
jwt.secret=resqnet-super-secret-jwt-signing-key-2026-must-be-at-least-256-bits-long
jwt.expiration=86400000

# ============================================
# Logging
# ============================================
logging.level.com.resqnet=DEBUG
logging.level.org.springframework.security=INFO
